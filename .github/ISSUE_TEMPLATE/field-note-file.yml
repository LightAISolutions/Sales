name: "📎 Field note file"
description: "Upload a Word doc or PDF of meeting/trade-show notes — the file is saved and logged automatically."
title: "Field note file"
labels: ["field-note-file"]
body:
  - type: markdown
    attributes:
      value: |
        **Attach your .docx or .pdf in the notes box below** — drag it in, paste it, or tap the paperclip icon.
        The file is saved to the knowledge library and a placeholder entry appears in the field-note log; Claude writes the summary at the next triage pass.
  - type: dropdown
    id: company
    attributes:
      label: Company
      options:
        - byd
        - catl
        - flexgen
        - fluence
        - general
        - hithium
        - megmeet
        - sinexcel
        - sungrow
        - tesla
        - wartsila
    validations:
      required: true
  - type: dropdown
    id: sourcetype
    attributes:
      label: How you learned it
      options:
        - contact
        - event
        - call
        - news
        - other
    validations:
      required: true
  - type: textarea
    id: filenote
    attributes:
      label: File and context
      description: "Drag your Word/PDF here or use the paperclip. Optional typed context alongside the attachment is welcome."
      placeholder: "Attach the file here…"
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Your confidence in this information (0–100)
      options:
        - "100 — certain"
        - "90"
        - "80"
        - "70"
        - "60"
        - "50 — plausible"
        - "40"
        - "30"
        - "20"
        - "10"
        - "0 — rumor"
    validations:
      required: true

