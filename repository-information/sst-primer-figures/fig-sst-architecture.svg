<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 258" width="740" height="258" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d6758"/></marker>
  </defs>
  <!-- stage frames -->
  <rect x="112" y="18" width="180" height="230" rx="6" fill="#f4f8fb" stroke="#0b62a4" stroke-width="1.2"/>
  <rect x="308" y="18" width="220" height="230" rx="6" fill="#f4f8fb" stroke="#0b62a4" stroke-width="1.2"/>
  <rect x="544" y="18" width="150" height="230" rx="6" fill="#f4f8fb" stroke="#0b62a4" stroke-width="1.2"/>
  <text x="202" y="36" text-anchor="middle" font-size="11" font-weight="bold" fill="#08496f">STAGE 1 · MV AC → DC</text>
  <text x="202" y="50" text-anchor="middle" font-size="9" fill="#6d6758">Active front end (rectifier)</text>
  <text x="418" y="36" text-anchor="middle" font-size="11" font-weight="bold" fill="#08496f">STAGE 2 · ISOLATED DC → DC</text>
  <text x="418" y="50" text-anchor="middle" font-size="9" fill="#6d6758">Medium-frequency transformer link</text>
  <text x="619" y="36" text-anchor="middle" font-size="11" font-weight="bold" fill="#08496f">STAGE 3 · OUTPUT</text>
  <text x="619" y="50" text-anchor="middle" font-size="9" fill="#6d6758">Paralleled DC bus (or LV inverter)</text>
  <!-- grid input -->
  <text x="20" y="120" font-size="10" font-weight="bold" fill="#23211c">Utility MV</text>
  <text x="20" y="134" font-size="9" fill="#6d6758">13.8 / 34.5 kV</text>
  <text x="20" y="147" font-size="9" fill="#6d6758">50/60 Hz, 3-phase</text>
  <line x1="20" y1="160" x2="112" y2="160" stroke="#6d6758" stroke-width="2" marker-end="url(#ar)"/>
  <!-- stage 1: series-stacked cells -->
  <g stroke="#0b62a4" stroke-width="1.2" fill="#fff">
    <rect x="140" y="72" width="60" height="26" rx="3"/><rect x="140" y="104" width="60" height="26" rx="3"/><rect x="140" y="136" width="60" height="26" rx="3"/><rect x="140" y="196" width="60" height="26" rx="3"/>
  </g>
  <g font-size="8" fill="#23211c" text-anchor="middle"><text x="170" y="89">H-bridge 1</text><text x="170" y="121">H-bridge 2</text><text x="170" y="153">H-bridge 3</text><text x="170" y="213">H-bridge N</text></g>
  <text x="170" y="182" text-anchor="middle" font-size="12" fill="#6d6758">⋮</text>
  <text x="235" y="118" font-size="8" fill="#6d6758">series-</text><text x="235" y="129" font-size="8" fill="#6d6758">stacked</text><text x="235" y="140" font-size="8" fill="#6d6758">per phase</text>
  <text x="170" y="240" text-anchor="middle" font-size="8" fill="#6d6758">SiC MOSFETs, 1.7–10 kV class</text>
  <!-- stage 2: per-cell DC links + MFT + DAB -->
  <g stroke="#0b62a4" stroke-width="1.2" fill="#fff">
    <rect x="322" y="72" width="44" height="26" rx="3"/><rect x="322" y="104" width="44" height="26" rx="3"/><rect x="322" y="136" width="44" height="26" rx="3"/><rect x="322" y="196" width="44" height="26" rx="3"/>
    <rect x="470" y="72" width="44" height="26" rx="3"/><rect x="470" y="104" width="44" height="26" rx="3"/><rect x="470" y="136" width="44" height="26" rx="3"/><rect x="470" y="196" width="44" height="26" rx="3"/>
  </g>
  <g font-size="7.5" fill="#23211c" text-anchor="middle"><text x="344" y="88">DC link</text><text x="344" y="120">DC link</text><text x="344" y="152">DC link</text><text x="344" y="212">DC link</text>
  <text x="492" y="88">DAB sec.</text><text x="492" y="120">DAB sec.</text><text x="492" y="152">DAB sec.</text><text x="492" y="212">DAB sec.</text></g>
  <!-- MFT symbols (two coils) -->
  <g stroke="#c2622a" stroke-width="1.6" fill="none">
    <path d="M400 76 q6 5 0 10 q6 5 0 10 M418 76 q-6 5 0 10 q-6 5 0 10 M408 74 v16 M410 74 v16"/>
    <path d="M400 108 q6 5 0 10 q6 5 0 10 M418 108 q-6 5 0 10 q-6 5 0 10 M408 106 v16 M410 106 v16"/>
    <path d="M400 140 q6 5 0 10 q6 5 0 10 M418 140 q-6 5 0 10 q-6 5 0 10 M408 138 v16 M410 138 v16"/>
    <path d="M400 200 q6 5 0 10 q6 5 0 10 M418 200 q-6 5 0 10 q-6 5 0 10 M408 198 v16 M410 198 v16"/>
  </g>
  <text x="409" y="182" text-anchor="middle" font-size="12" fill="#6d6758">⋮</text>
  <g stroke="#6d6758" stroke-width="1"><line x1="366" y1="85" x2="398" y2="85"/><line x1="420" y1="85" x2="470" y2="85"/><line x1="366" y1="117" x2="398" y2="117"/><line x1="420" y1="117" x2="470" y2="117"/><line x1="366" y1="149" x2="398" y2="149"/><line x1="420" y1="149" x2="470" y2="149"/><line x1="366" y1="209" x2="398" y2="209"/><line x1="420" y1="209" x2="470" y2="209"/></g>
  <text x="418" y="240" text-anchor="middle" font-size="8" fill="#6d6758">5–50 kHz · nanocrystalline / ferrite core · galvanic isolation</text>
  <!-- stage 3: parallel bus -->
  <g stroke="#6d6758" stroke-width="1"><line x1="514" y1="85" x2="570" y2="85"/><line x1="514" y1="117" x2="570" y2="117"/><line x1="514" y1="149" x2="570" y2="149"/><line x1="514" y1="209" x2="570" y2="209"/></g>
  <line x1="570" y1="70" x2="570" y2="225" stroke="#0b62a4" stroke-width="3"/>
  <text x="600" y="110" font-size="10" font-weight="bold" fill="#0b62a4">800 V DC (POS)</text>
  <text x="600" y="160" font-size="10" font-weight="bold" fill="#0b62a4">RTN</text>
  <text x="600" y="185" font-size="8" fill="#6d6758">outputs paralleled</text>
  <text x="600" y="196" font-size="8" fill="#6d6758">(ISOP topology)</text>
  <line x1="570" y1="140" x2="694" y2="140" stroke="#0b62a4" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="619" y="240" text-anchor="middle" font-size="8" fill="#6d6758">800 V DC to hall busway</text>
</svg>
